<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Today's Daily Fortune | MyBirthSign</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0a2a;color:#e9e3ff;font:1rem/1.6 Georgia,serif;text-align:center;padding:0 16px}a{color:#e7c27a}</style>
<script>
/* Menu link "Today's Daily Fortune": opens today's post (Cambodia date). If today's post is not out yet,
   opens the newest one from the last week; if none is found, the blog. Keeps ?lang= so the language stays. */
(function () {
  var q = /[?&]lang=(en|km)\b/.exec(location.search), tail = q ? "?lang=" + q[1] : "";
  function go(u) { location.replace(u + tail); }
  function ppDate(back) {
    var d = new Date(Date.now() + 7 * 3600000 - back * 86400000);   // Cambodia is UTC+7 all year
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  if (!window.fetch) { go("blog/daily-fortune-" + ppDate(0) + ".html"); return; }
  var i = 0;
  (function next() {
    if (i > 7) { go("blog.html"); return; }
    var u = "blog/daily-fortune-" + ppDate(i++) + ".html";
    fetch(u, { method: "HEAD", cache: "no-store" }).then(function (r) { if (r.ok) go(u); else next(); }).catch(next);
  })();
})();
</script>
</head>
<body>
<p>Opening today's daily fortune… / កំពុងបើកជោគជតាថ្ងៃនេះ…<br><a href="blog.html">Blog</a></p>
</body>
</html>
