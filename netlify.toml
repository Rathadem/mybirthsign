[build]
  functions = "netlify/functions"
  # link previews for shared results (netlify/edge-functions/share-preview.js)
  edge_functions = "netlify/edge-functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  # the AI Friend reads the site's own calculation files so its answers use the real results
  included_files = ["js/zodiac-data.js", "js/business-data.js", "js/mbs-engine.js", "data/daily/latest.json"]

# Canonical host: send www (and plain http) to https://mybirthsign.com with a permanent redirect.
[[redirects]]
  from = "https://www.mybirthsign.com/*"
  to = "https://mybirthsign.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mybirthsign.com/*"
  to = "https://mybirthsign.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://mybirthsign.com/*"
  to = "https://mybirthsign.com/:splat"
  status = 301
  force = true

# Pretty URL for the zodiac guide page (file is animals.html). Rewrite, not redirect,
# so static files such as robots.txt / sitemap.xml are never affected.
[[redirects]]
  from = "/zodiac-guide"
  to = "/animals.html"
  status = 200

# Speed: let browsers reuse images for a day (they are not fingerprinted, so keep it short).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Daily zodiac data: small public JSON, refreshed once a day. Browsers re-check after 5 minutes;
# the CDN may serve the previous copy for a moment while it fetches the new one.
[[headers]]
  for = "/data/daily/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
