 <pattern id="stars" width="118" height="91" patternUnits="userSpaceOnUse"><circle cx="15" cy="18" r="1.6" fill="#f6e8b5" opacity=".8"/><circle cx="71" cy="53" r="1" fill="#fff" opacity=".75"/><circle cx="105" cy="9" r="1.3" fill="#d8c4ff" opacity=".65"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
