name: Daily data preview (test only, never publishes)

# Runs only on the site-update test branch. Generates tomorrow's daily data with the real
# Claude wording, validates it, and attaches the result as a downloadable artifact.
# Nothing is committed or deployed. Remove this file before going live.
on:
  push:
    branches: [site-update]
    paths: ["scripts/daily-data*.mjs", "tests/daily-data-test.mjs", ".github/workflows/daily-data-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate + validate (real Claude wording)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::Add the ANTHROPIC_API_KEY repository secret to run this preview"; exit 0; fi
          node -e 'const k=process.env.ANTHROPIC_API_KEY;const t=k.trim();console.log("::warning::key check: starts with "+t.slice(0,13)+"… length "+t.length+(k!==t?" (HAS EXTRA SPACES/NEWLINES)":"")+(/\s/.test(t)?" (HAS SPACES INSIDE)":""))'
          D=$(TZ=Asia/Phnom_Penh date -d tomorrow +%F)
          mkdir -p preview-out
          set +e; node scripts/daily-data.mjs --date "$D" --out preview-out > preview-out/log.txt 2>&1; rc=$?; set -e
          cat preview-out/log.txt
          grep -E "Claude error|NOT PUBLISHED|INVALID|Could not parse|valid:|usage|tokens" preview-out/log.txt | head -8 | cut -c1-400 | while IFS= read -r l; do echo "::warning::$l"; done
          [ $rc -ne 0 ] && cp /tmp/daily-data-rejected-*.json preview-out/ 2>/dev/null || true
          ls -la preview-out || true
          [ -f "preview-out/$D.json" ] && node tests/daily-data-test.mjs "preview-out/$D.json"
      - name: Show samples (test only)
        if: always()
        run: |
          f=$(ls preview-out/20*.json 2>/dev/null | head -1); [ -z "$f" ] && exit 0
          node -e '
            const r=require("./"+process.argv[1]); const out=[];
            out.push("DAY "+r.date+" day animal "+r.dayAnimal+" | highlights "+JSON.stringify(r.highlights).slice(0,350));
            for (const a of ["Rat","Dragon","Horse"]) { const s=r.signs.find(x=>x.animal===a); if(!s) continue;
              out.push(a+" ["+s.tier+"] "+s.label.en+" | lucky "+JSON.stringify(s.lucky));
              out.push(a+" EN fortune: "+s.text.en.fortune); out.push(a+" EN love: "+s.text.en.love+" | advice: "+s.text.en.advice);
              out.push(a+" KM fortune: "+s.text.km.fortune); }
            out.slice(0,15).forEach(l=>console.log("::notice::"+l.replace(/\n/g," ").slice(0,900)));' "$f"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-data-preview
          path: preview-out/
          if-no-files-found: ignore
