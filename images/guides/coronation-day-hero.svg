<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Cambodian Royal Coronation — palace-inspired illustration</title>
<desc id="desc">An original illustration of ornate Khmer palace roofs glowing gold beneath a twilight sky, with lotus motifs and soft ceremonial light.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#080d29"/><stop offset=".53" stop-color="#292051"/><stop offset="1" stop-color="#642e61"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#fff4c7"/><stop offset=".55" stop-color="#e9c778"/><stop offset="1" stop-color="#d49c52" stop-opacity=".06"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0ae"/><stop offset=".4" stop-color="#dcb45d"/><stop offset="1" stop-color="#87602d"/></linearGradient>
