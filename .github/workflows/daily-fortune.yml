name: Daily zodiac fortune

# Publishes "Today's Fortune for Each Zodiac Animal" every day.
# 17:10 UTC is 00:10 the next morning in Cambodia (UTC+7), so the new day's post is ready at midnight there.
on:
  schedule:
    - cron: "10 17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD). Leave empty for today (Asia/Phnom_Penh)."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-fortune
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's fortune post
        env:
          FORTUNE_DATE: ${{ github.event.inputs.date }}
          FORTUNE_TZ: Asia/Phnom_Penh
        run: |
          if [ -n "$FORTUNE_DATE" ]; then
            node scripts/daily-fortune.mjs --date "$FORTUNE_DATE"
          else
            node scripts/daily-fortune.mjs
          fi

      # Daily data (data/daily/<date>.json + latest.json) for the website and Kru Toch.
      # Rules decide every fact; Claude writes the wording; the record is checked and only
      # published if it passes. If anything fails, the blog post above still goes out and
      # yesterday's data simply stays in place.
      - name: Daily data (rules + Claude wording, validated)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORTUNE_DATE: ${{ github.event.inputs.date }}
          FORTUNE_TZ: Asia/Phnom_Penh
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set, skipping daily data"
            exit 0
          fi
          node scripts/daily-data.mjs
          node scripts/daily-data.mjs --validate data/daily/latest.json

      - name: Commit and push (Netlify deploys on push)
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "daily-fortune-bot"
          git config user.email "daily-fortune-bot@users.noreply.github.com"
          git add blog sitemap.xml blog.html index.html
          [ -d data/daily ] && git add data/daily
          git commit -m "Daily fortune: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
